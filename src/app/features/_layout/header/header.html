<header class="app-header">
  <a class="brand" routerLink="/">
    <span class="brand-mark" aria-hidden="true">
      <!-- grugno di maiale -->
      <svg viewBox="0 0 40 40" width="26" height="26" focusable="false">
        <ellipse cx="20" cy="20" rx="17" ry="13" fill="none" stroke="currentColor" stroke-width="3.4" />
        <circle cx="13.5" cy="20" r="3.1" fill="currentColor" />
        <circle cx="26.5" cy="20" r="3.1" fill="currentColor" />
      </svg>
    </span>
    <span>
      <strong>OinkMed</strong>
      <small>Flashcard di medicina</small>
    </span>
  </a>

  <nav aria-label="Navigazione principale">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i class="pi pi-bolt" aria-hidden="true"></i>
      Deck
    </a>
    <a routerLink="/new" routerLinkActive="active">
      <i class="pi pi-plus" aria-hidden="true"></i>
      Gestisci
    </a>
  </nav>
</header>
